version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vidyasetu_postgres
    restart: always
    environment:
      POSTGRES_USER: vidyasetu
      POSTGRES_PASSWORD: vidyasetu_secure_password_2026
      POSTGRES_DB: vidyasetu_mp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vidyasetu -d vidyasetu_mp"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vidyasetu_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: vidyasetu_vector_db
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  minio:
    image: minio/minio:latest
    container_name: vidyasetu_storage
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: vidyasetu_admin
      MINIO_ROOT_PASSWORD: vidyasetu_storage_password_2026
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
